name: Clojure CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-using-java-8:
    name: 'Test using Java 8'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 8

    - name: Print java version
      run: java -version

    - name: Install clojure
      uses: DeLaGuardo/setup-clojure@main
      with:
        cli: '1.10.3.1087'
        bb: latest
        clj-kondo: latest

    - name: maven cache
      uses: actions/cache@v6
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
        restore-keys: ${{ runner.os }}-maven-

    - name: Install dependencies
      run: bb deps

    - name: Run midje tests
      run: bb test:midje

    - name: Run clj tests with Clojure 1.8
      run: bb test:clj -A:1.8

    - name: Run clj tests with Clojure 1.9
      run: bb test:clj -A:1.9

    - name: Run clj tests with Clojure 1.10
      run: bb test:clj -A:1.10

    - name: Run clj tests with Clojure 1.11
      run: bb test:clj -A:1.11

    # new versions of shadow-cljs don't work on java 8
    # - name: Run cljs tests with Clojure 1.10
    #   run: bb test:node -A:1.10

    # - name: Run cljs tests with Clojure 1.11
    #   run: bb test:node -A:1.11

  test-using-java-21:
    name: 'Test using Java 21'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 21

    - name: Print java version
      run: java -version

    - name: Install clojure
      uses: DeLaGuardo/setup-clojure@main
      with:
        cli: '1.10.3.1087'
        bb: latest
        clj-kondo: latest

    - name: maven cache
      uses: actions/cache@v6
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
        restore-keys: ${{ runner.os }}-maven-

    - name: Install dependencies
      run: bb deps

    - name: Run midje tests
      run: bb test:midje

    - name: Run clj tests with Clojure 1.8
      run: bb test:clj -A:1.8

    - name: Run clj tests with Clojure 1.9
      run: bb test:clj -A:1.9

    - name: Run clj tests with Clojure 1.10
      run: bb test:clj -A:1.10

    - name: Run clj tests with Clojure 1.11
      run: bb test:clj -A:1.11

    - name: Run cljs tests with Clojure 1.10
      run: bb test:node -A:1.10

    - name: Run cljs tests with Clojure 1.11
      run: bb test:node -A:1.11
